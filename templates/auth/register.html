<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Ygam</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/register.css') }}">
</head>
<body>
    <div class="container">
        <div class="register-box">
            <div class="header">
                <h1>Ygam</h1>
                <p class="subtitle">Messagerie chiffrée de bout en bout</p>
            </div>

            <form id="registerForm" method="POST" action="/auth/register">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        minlength="3"
                        maxlength="50"
                        placeholder="Votre nom d'utilisateur"
                        autocomplete="username"
                    >
                    <span class="error-message" id="username-error"></span>
                </div>

                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="votre@email.com"
                        autocomplete="email"
                    >
                    <span class="error-message" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="8"
                        placeholder="Minimum 8 caractères"
                        autocomplete="new-password"
                    >
                    <span class="error-message" id="password-error"></span>
                    <div class="password-strength" id="password-strength">
                        <div class="strength-bar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmer le mot de passe</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        required
                        placeholder="Retapez votre mot de passe"
                        autocomplete="new-password"
                    >
                    <span class="error-message" id="confirm-password-error"></span>
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">
                    <span class="btn-text">Créer mon compte</span>
                    <span class="btn-loader" style="display: none;"></span>
                </button>

                <div class="alert" id="alert" style="display: none;"></div>
            </form>

            <div class="footer">
                <p>Vous avez déjà un compte ? <a href="/auth/login">Se connecter</a></p>
            </div>

        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirm-password');
        const username = document.getElementById('username');
        const email = document.getElementById('email');
        const submitBtn = document.getElementById('submit-btn');
        const alert = document.getElementById('alert');

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            let hash = encoder.encode(password);

            for (let i = 0; i < 1000; i++) {
                hash = await crypto.subtle.digest('SHA-256', hash);
            }

            return Array.from(new Uint8Array(hash))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        password.addEventListener('input', function() {
            const strength = checkPasswordStrength(this.value);
            updatePasswordStrength(strength);
        });

        // Vérification de la confirmation du mot de passe
        confirmPassword.addEventListener('input', function() {
            if (this.value !== password.value) {
                showError('confirm-password', 'Les mots de passe ne correspondent pas');
            } else {
                clearError('confirm-password');
            }
        });

        // Validation du formulaire
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Réinitialiser les erreurs
            clearAllErrors();
            hideAlert();

            // Validation
            let isValid = true;

            if (username.value.length < 3) {
                showError('username', 'Le nom d\'utilisateur doit contenir au moins 3 caractères');
                isValid = false;
            }

            if (!isValidEmail(email.value)) {
                showError('email', 'Adresse email invalide');
                isValid = false;
            }

            if (password.value.length < 8) {
                showError('password', 'Le mot de passe doit contenir au moins 8 caractères');
                isValid = false;
            }

            if (password.value !== confirmPassword.value) {
                showError('confirm-password', 'Les mots de passe ne correspondent pas');
                isValid = false;
            }

            if (!isValid) return;

            // Envoi du formulaire
            setLoading(true);

            try {
                const hashedPassword = await hashPassword(password.value);

                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username.value,
                        email: email.value,
                        password: hashedPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message || 'Compte créé avec succès ! Redirection...', 'success');
                    setTimeout(() => {
                        window.location.href = '/auth/login';
                    }, 1500);
                } else {
                    showAlert(data.message || 'Erreur lors de la création du compte', 'error');
                }
            } catch (error) {
                showAlert('Erreur de connexion au serveur', 'error');
            } finally {
                setLoading(false);
            }
        });

        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z\d]/.test(password)) strength++;
            return Math.min(strength, 4);
        }

        function updatePasswordStrength(strength) {
            const strengthBar = document.querySelector('.strength-bar');
            const colors = ['#ef4444', '#f59e0b', '#eab308', '#22c55e', '#10b981'];
            const widths = ['20%', '40%', '60%', '80%', '100%'];

            if (password.value.length === 0) {
                strengthBar.style.width = '0%';
                return;
            }

            strengthBar.style.width = widths[strength];
            strengthBar.style.backgroundColor = colors[strength];
        }

        function showError(fieldId, message) {
            const errorElement = document.getElementById(`${fieldId}-error`);
            const inputElement = document.getElementById(fieldId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            inputElement.classList.add('error');
        }

        function clearError(fieldId) {
            const errorElement = document.getElementById(`${fieldId}-error`);
            const inputElement = document.getElementById(fieldId);
            errorElement.textContent = '';
            errorElement.style.display = 'none';
            inputElement.classList.remove('error');
        }

        function clearAllErrors() {
            ['username', 'email', 'password', 'confirm-password'].forEach(clearError);
        }

        function showAlert(message, type) {
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
        }

        function hideAlert() {
            alert.style.display = 'none';
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function setLoading(loading) {
            const btnText = document.querySelector('.btn-text');
            const btnLoader = document.querySelector('.btn-loader');

            if (loading) {
                btnText.style.display = 'none';
                btnLoader.style.display = 'inline-block';
                submitBtn.disabled = true;
            } else {
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
