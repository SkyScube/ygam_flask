<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Ygam</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/register.css') }}">
</head>
<body>
    <div class="container">
        <div class="register-box">
            <div class="header">
                <h1>Ygam</h1>
                <p class="subtitle">Messagerie chiffrée de bout en bout</p>
            </div>

            <form id="loginForm" method="POST" action="/api/auth/login">
                <div class="form-group">
                    <label for="identifier">Nom d'utilisateur ou email</label>
                    <input
                        type="text"
                        id="identifier"
                        name="identifier"
                        required
                        placeholder="Votre nom d'utilisateur ou email"
                        autocomplete="username"
                    >
                    <span class="error-message" id="identifier-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                    >
                    <span class="error-message" id="password-error"></span>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Se souvenir de moi</span>
                    </label>
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">
                    <span class="btn-text">Se connecter</span>
                    <span class="btn-loader" style="display: none;"></span>
                </button>

                <div class="alert" id="alert" style="display: none;"></div>
            </form>

            <div class="footer">
                <p>Pas encore de compte ? <a href="/auth/register">Créer un compte</a></p>
                <p style="margin-top: 8px;"><a href="/auth/forgot-password" style="font-size: 13px;">Mot de passe oublié ?</a></p>
            </div>

        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const password = document.getElementById('password');
        const identifier = document.getElementById('identifier');
        const submitBtn = document.getElementById('submit-btn');
        const alert = document.getElementById('alert');

        // ===== HASHING CLIENT-SIDE SHA-256 x1000 =====
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            let hash = encoder.encode(password);

            for (let i = 0; i < 1000; i++) {
                hash = await crypto.subtle.digest('SHA-256', hash);
            }

            return Array.from(new Uint8Array(hash))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        // Validation du formulaire
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Réinitialiser les erreurs
            clearAllErrors();
            hideAlert();

            // Validation
            let isValid = true;

            if (identifier.value.length < 3) {
                showError('identifier', 'Veuillez entrer votre nom d\'utilisateur ou email');
                isValid = false;
            }

            if (password.value.length < 1) {
                showError('password', 'Veuillez entrer votre mot de passe');
                isValid = false;
            }

            if (!isValid) return;

            // Envoi du formulaire
            setLoading(true);

            try {
                // Hash le mot de passe côté client (SHA-256 x1000)
                const hashedPassword = await hashPassword(password.value);

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        identifier: identifier.value,
                        password: hashedPassword,
                        remember: document.getElementById('remember').checked
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Stocker les tokens
                    if (data.access_token) {
                        localStorage.setItem('access_token', data.access_token);
                    }
                    if (data.refresh_token) {
                        localStorage.setItem('refresh_token', data.refresh_token);
                    }

                    showAlert('Connexion réussie ! Redirection...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    showAlert(data.message || 'Identifiants incorrects', 'error');
                }
            } catch (error) {
                showAlert('Erreur de connexion au serveur', 'error');
            } finally {
                setLoading(false);
            }
        });

        function showError(fieldId, message) {
            const errorElement = document.getElementById(`${fieldId}-error`);
            const inputElement = document.getElementById(fieldId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            inputElement.classList.add('error');
        }

        function clearError(fieldId) {
            const errorElement = document.getElementById(`${fieldId}-error`);
            const inputElement = document.getElementById(fieldId);
            errorElement.textContent = '';
            errorElement.style.display = 'none';
            inputElement.classList.remove('error');
        }

        function clearAllErrors() {
            ['identifier', 'password'].forEach(clearError);
        }

        function showAlert(message, type) {
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
        }

        function hideAlert() {
            alert.style.display = 'none';
        }

        function setLoading(loading) {
            const btnText = document.querySelector('.btn-text');
            const btnLoader = document.querySelector('.btn-loader');

            if (loading) {
                btnText.style.display = 'none';
                btnLoader.style.display = 'inline-block';
                submitBtn.disabled = true;
            } else {
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
                submitBtn.disabled = false;
            }
        }

        // Auto-focus sur le premier champ
        identifier.focus();
    </script>
</body>
</html>
