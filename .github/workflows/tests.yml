name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Run tests with pytest
      env:
        FLASK_ENV: testing
        DATABASE_URL: "sqlite:///:memory:"
        JWT_SECRET: test_secret_key_for_testing_only_32chars_long_enough
      run: |
        pytest -v --tb=short --junit-xml=test-results.xml

    - name: Test Summary
      if: always()
      run: |
        echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f test-results.xml ]; then
          TOTAL=$(grep -oP 'tests="\K[0-9]+' test-results.xml | head -1)
          FAILURES=$(grep -oP 'failures="\K[0-9]+' test-results.xml | head -1)
          ERRORS=$(grep -oP 'errors="\K[0-9]+' test-results.xml | head -1)
          SKIPPED=$(grep -oP 'skipped="\K[0-9]+' test-results.xml | head -1)
          PASSED=$((TOTAL - FAILURES - ERRORS - SKIPPED))

          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Passed:** $PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ **Failed:** $FAILURES" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ **Errors:** $ERRORS" >> $GITHUB_STEP_SUMMARY
          echo "- ⏭️ **Skipped:** $SKIPPED" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 **Total:** $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $FAILURES -eq 0 ] && [ $ERRORS -eq 0 ]; then
            echo "### ✨ All tests passed! Great job! 🎉" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Some tests failed. Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "⚠️ Test results file not found" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results.xml
