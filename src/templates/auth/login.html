<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Ygam</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/register.css') }}">
</head>
<body>
    <div class="container">
        <div class="register-box">
            <div class="header">
                <h1>Ygam</h1>
                <p class="subtitle">Messagerie chiffrée de bout en bout</p>
            </div>

            <form id="loginForm" method="POST" action="/api/auth/login">
                <div class="form-group">
                    <label for="identifier">Nom d'utilisateur ou email</label>
                    <input
                        type="email"
                        id="identifier"
                        name="identifier"
                        required
                        placeholder="Email"
                        autocomplete="email"
                    >
                    <span class="error-message" id="identifier-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                    >
                    <span class="error-message" id="password-error"></span>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Se souvenir de moi</span>
                    </label>
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">
                    <span class="btn-text">Se connecter</span>
                    <span class="btn-loader" style="display: none;"></span>
                </button>

                <div class="alert" id="alert" style="display: none;"></div>
            </form>

            <div class="footer">
                <p>Pas encore de compte ? <a href="/auth/register">Créer un compte</a></p>
                <p style="margin-top: 8px;"><a href="/auth/forgot-password" style="font-size: 13px;">Mot de passe oublié ?</a></p>
            </div>

        </div>
    </div>

    <!-- JavaScript files -->
    <script src="{{ url_for('static', filename='js/auth-common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
