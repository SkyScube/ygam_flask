<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Ygam</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/register.css') }}">
</head>
<body>
    <div class="container">
        <div class="register-box">
            <div class="header">
                <h1>Ygam</h1>
                <p class="subtitle">Messagerie chiffrée de bout en bout</p>
            </div>

            <form id="registerForm" method="POST" action="/auth/register">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        minlength="3"
                        maxlength="50"
                        placeholder="Votre nom d'utilisateur"
                        autocomplete="username"
                    >
                    <span class="error-message" id="username-error"></span>
                </div>

                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="votre@email.com"
                        autocomplete="email"
                    >
                    <span class="error-message" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="8"
                        placeholder="Minimum 8 caractères"
                        autocomplete="new-password"
                    >
                    <span class="error-message" id="password-error"></span>
                    <div class="password-strength" id="password-strength">
                        <div class="strength-bar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirmer le mot de passe</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        required
                        placeholder="Retapez votre mot de passe"
                        autocomplete="new-password"
                    >
                    <span class="error-message" id="confirm-password-error"></span>
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">
                    <span class="btn-text">Créer mon compte</span>
                    <span class="btn-loader" style="display: none;"></span>
                </button>

                <div class="alert" id="alert" style="display: none;"></div>
            </form>

            <div class="footer">
                <p>Vous avez déjà un compte ? <a href="/auth/login">Se connecter</a></p>
            </div>

        </div>
    </div>

    <!-- JavaScript files -->
    <script src="{{ url_for('static', filename='js/auth-common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
